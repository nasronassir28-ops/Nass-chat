<title>Nacer chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6fa; --surface: #ffffff; --surface2: #eef1f6; --ink: #101828; --muted: #667085; --line: #e6eaf0;
    --p: #14b8a6; --p2: #0ea5e9; --grad: linear-gradient(135deg, #14b8a6 0%, #0ea5e9 100%);
    --other: #eef1f6; --otherText: #101828; --chatbg: #f6f8fb; --shadow: 0 1px 3px rgba(16,24,40,.08);
    --danger: #e5484d; --tint: rgba(20,184,166,.12); --badge: 70px;
  }
  [data-theme=dark] {
    --bg: #0a101c; --surface: #121a2b; --surface2: #1b2640; --ink: #e8edf6; --muted: #8fa0bd; --line: #223049;
    --other: #1e2a45; --otherText: #e8edf6; --chatbg: #0d1525; --shadow: none; --tint: rgba(20,184,166,.2);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: 'Tajawal', system-ui, 'Segoe UI', Tahoma, Arial, sans-serif; color: var(--ink); background: var(--bg); }
  button, input, textarea { font-family: inherit; color: inherit; }
  svg { display: block; }
  #app { height: 100dvh; max-width: 760px; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; position: relative; overflow: hidden; }
  @media (min-width: 780px) { #app { box-shadow: 0 0 40px rgba(16,24,40,.15); } }
  .screen { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .splash { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--surface); }

  /* header */
  header.top { background: var(--surface); padding: 8px 10px; padding-top: calc(8px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 6px; flex-shrink: 0; border-bottom: 1px solid var(--line); min-height: 58px; }
  header.top .htitle { flex: 1; font-size: 19px; font-weight: 800; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
  .brand { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ib { background: none; border: 0; color: var(--ink); width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; }
  .ib:active { background: var(--surface2); }
  .ib.acc { color: var(--p); background: var(--tint); }
  .ib.acc:active { background: var(--surface2); }
  .hbtn { background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-shrink: 0; }
  header.top input.sinput { flex: 1; min-width: 0; background: var(--surface2); border: 0; border-radius: 22px; padding: 10px 16px; font-size: 16px; outline: none; }
  header.top input.sinput::placeholder { color: var(--muted); }
  .avatar { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 20px; flex-shrink: 0; overflow: hidden; }
  .avatar img, .bigav img { width: 100%; height: 100%; object-fit: cover; display: block; }
  header.top .avatar { width: 38px; height: 38px; font-size: 16px; }

  /* lists */
  .list { flex: 1; overflow-y: auto; }
  .searchbar { margin: 10px 12px 4px; background: var(--surface2); border-radius: 22px; padding: 11px 16px; display: flex; gap: 10px; align-items: center; color: var(--muted); cursor: pointer; font-size: 15px; }
  .row { display: flex; align-items: center; gap: 13px; padding: 11px 14px; cursor: pointer; background: var(--bg); }
  .row:active { background: var(--surface2); }
  .row .info { flex: 1; min-width: 0; }
  .row .name { font-weight: 700; font-size: 16px; }
  .row .sub { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .row .sub.bold { font-weight: 700; color: var(--ink); }
  .row .meta { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .row .time.hot { color: var(--p); font-weight: 700; }
  .badge { background: var(--grad); color: #fff; border-radius: 12px; min-width: 22px; text-align: center; padding: 1px 7px; font-size: 12px; font-weight: 700; }
  .empty { text-align: center; color: var(--muted); padding: 40px 28px; line-height: 1.9; }
  .empty .ill { width: 150px; height: auto; margin: 0 auto 8px; }
  .ill .b { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
  .fab { position: absolute; bottom: calc(24px + var(--badge)); inset-inline-end: 20px; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--grad); color: #fff; box-shadow: 0 8px 20px rgba(14,165,233,.4); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .fab:active { transform: scale(.94); }

  /* chat */
  .msgs { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; background: var(--chatbg); }
  .more { align-self: center; border: 0; background: var(--surface); color: var(--p); border-radius: 18px; padding: 7px 16px; font-size: 13px; cursor: pointer; box-shadow: var(--shadow); margin-bottom: 6px; }
  .empty-chat { margin: auto; text-align: center; color: var(--muted); line-height: 1.8; }
  .empty-chat .ill { width: 130px; height: auto; margin: 0 auto; }
  .bubble { max-width: 78%; padding: 8px 13px 6px; border-radius: 20px; font-size: 16px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; position: relative; user-select: text; }
  .bubble.mine { align-self: flex-start; background: var(--grad); color: #fff; border-end-start-radius: 6px; }
  .bubble.other { align-self: flex-end; background: var(--other); color: var(--otherText); border-end-end-radius: 6px; }
  .bubble.big { background: none !important; font-size: 46px; padding: 0 4px; line-height: 1.2; }
  .bubble.deleted { background: transparent !important; border: 1px dashed var(--line); color: var(--muted) !important; font-style: italic; }
  .bubble .t { font-size: 10.5px; opacity: .8; display: flex; align-items: center; gap: 4px; margin-top: 2px; white-space: normal; }
  .tk2 { display: inline-flex; }
  .tk2 svg + svg { margin-inline-start: -8px; }
  .bubble .mimg { max-width: 100%; max-height: 320px; border-radius: 14px; display: block; margin-bottom: 4px; cursor: zoom-in; }
  .bubble.vid { max-width: 92%; }
  .vwrap { position: relative; width: min(84vw, 400px); border-radius: 14px; overflow: hidden; background: #000; margin-bottom: 4px; }
  .vwrap video { display: block; width: 100%; height: 62vh; max-height: 78vh; object-fit: contain; background: #000; }
  .vph { height: 62vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #fff; cursor: pointer; background: linear-gradient(135deg, #0f172a, #1e293b); }
  .vph .pbtn { width: 62px; height: 62px; border-radius: 50%; background: rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center; }
  .vph .vsz { font-size: 13px; opacity: .85; }
  .vfs { position: absolute; top: 8px; inset-inline-end: 8px; border: 0; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,.5); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .avwrap { position: relative; flex-shrink: 0; display: flex; }
  .pdot { position: absolute; bottom: 1px; inset-inline-end: 1px; width: 13px; height: 13px; border-radius: 50%; background: #22c55e; border: 2px solid var(--surface, #fff); display: none; }
  .pdot.on { display: block; }
  header.top .pdot { width: 11px; height: 11px; bottom: 0; inset-inline-end: 0; }
  .hsub.onl { color: #16a34a; font-weight: 700; }
  .fcard { display: flex; align-items: center; gap: 10px; background: rgba(127,127,127,.16); border-radius: 14px; padding: 9px 10px; cursor: pointer; min-width: 190px; margin-bottom: 3px; white-space: normal; }
  .ficon { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.28); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .finfo { min-width: 0; }
  .fname { font-weight: 700; font-size: 14px; word-break: break-all; }
  .fsize { font-size: 12px; opacity: .8; }
  .blockbar { display: none; padding: 16px; text-align: center; background: var(--surface); border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; flex-direction: column; gap: 10px; padding-bottom: calc(16px + var(--badge)); }
  .composer { display: flex; align-items: flex-end; gap: 4px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom) + var(--badge)); background: var(--surface); border-top: 1px solid var(--line); flex-shrink: 0; }
  .cb { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; color: var(--p); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; flex-shrink: 0; padding: 0; }
  .cb:active { background: var(--tint); }

async function fetchFileBlob(chatRef, msgId, f, onProgress, key) {
  const parts = new Array(f.chunks);
  const queue = [...Array(f.chunks).keys()];
  let done = 0;
  async function get(i) {
    const s = await getDoc(doc(chatRef, 'messages', msgId + '_' + i));
    if (!s.exists() || !s.data().data) throw new Error('الملف غير متوفر (حُذف أو لم يكتمل رفعه)');
    if (f.enc) {
      if (!key) throw new Error('تعذّر فك تشفير الملف على هذا الجهاز');
      parts[i] = await aesDecBytes(key, s.data().data);
    } else parts[i] = b64ToBytes(s.data().data);
    done++;
    if (onProgress) onProgress(done, f.chunks);
  }
  await Promise.all([0, 1, 2].map(async () => { while (queue.length) await get(queue.shift()); }));
  return new Blob(parts, { type: f.type || 'application/octet-stream' });
}

/* تجهيز مفاتيح هذا الحساب على هذا الجهاز (userData=null يعني تعذّر قراءة الحساب، فلا نُنشئ مفاتيح جديدة) */
async function setupKeys(u, userData, password) {
  myKeys = null;
  if (!subtle) return;
  try {
    const lsKey = 'mc_kp_' + u.uid;
    let local = null;
    try { local = JSON.parse(getStored(lsKey) || 'null'); } catch (_) {}
    const use = async (privJwk, pubStr) => {
      myKeys = { priv: await subtle.importKey('jwk', privJwk, ECDH, false, ['deriveKey']), pub: pubStr };
      pubCache.set(u.uid, pubStr);
    };
    if (userData === null) {            // بدون اتصال: استخدم النسخة المحلية فقط
      if (local && local.priv && local.pub) await use(local.priv, local.pub);
      return;
    }
    const pubStr = userData.pub || null;
    let pubJ = null;
    try { pubJ = pubStr ? JSON.parse(pubStr) : null; } catch (_) {}
    if (local && local.priv && pubJ && sameKey(pubJ, local.priv)) { await use(local.priv, pubStr); return; }
    if (userData.kb && password && pubJ) {      // جهاز جديد: استعد المفتاح من النسخة الاحتياطية المحمية بكلمة المرور
      try {
        const pr = await unwrapPriv(userData.kb, password);
        if (sameKey(pubJ, pr)) { setStored(lsKey, JSON.stringify({ priv: pr, pub: pubStr })); await use(pr, pubStr); return; }
      } catch (_) {}
    }
    const kp = await genKeyPair();          // لا مفاتيح صالحة: أنشئ مفاتيح جديدة
    const newPub = JSON.stringify(kp.pubJwk);
    await setDoc(doc(db, 'users', u.uid), { pub: newPub }, { merge: true });
    if (password) await setDoc(doc(db, 'users', u.uid, 'private', 'data'), { kb: await wrapPriv(kp.privJwk, password) }, { merge: true });
    else await setDoc(doc(db, 'users', u.uid, 'private', 'data'), { kb: deleteField() }, { merge: true }).catch(() => {});
    setStored(lsKey, JSON.stringify({ priv: kp.privJwk, pub: newPub }));
    await use(kp.privJwk, newPub);
  } catch (_) { myKeys = null; }
}

async function chatKey(uid, force) {

async function securityCode(uid) {

  if (!a || !b) return null;
  const pair = [[me.uid, a], [uid, b]].sort((x, y) => (x[0] < y[0] ? -1 : 1));
  const hash = new Uint8Array(await subtle.digest('SHA-256', te.encode(pair[0][1] + '|' + pair[1][1])));

    const lm = await aesEncJSON(key, { t: preview });

  }

    msg: { text: payload.text || '', ...(payload.image ? { image: payload.image } : {}), ...(payload.file ? { file: payload.file } : {}) },

/* تحسين الصوت للشبكات الضعيفة: Opus بمعدل منخفض مع تصحيح الأخطاء وتوفير الإرسال أثناء الصمت */

    const m = /a=rtpmap:(\d+) opus\/48000\/2/.exec(sdp);
    if (!m) return sdp;
    const pt = m[1];
    const re = new RegExp('a=fmtp:' + pt + ' ([^\\r\\n]*)');
    return sdp.replace(re, (all, params) => {
      const ps = params.split(';').filter(Boolean);
      const have = new Set(ps.map(p => p.split('=')[0]));
      ['usedtx=1', 'useinbandfec=1', 'maxaveragebitrate=24000', 'stereo=0'].forEach(x => { if (!have.has(x.split('=')[0])) ps.push(x); });
      return 'a=fmtp:' + pt + ' ' + ps.join(';');
    });
  } catch (_) { return sdp; }
}
function tuneSenders(c) {

    c.pc.getSenders().forEach(s => {
      if (!s.track || !s.getParameters) return;
      const p = s.getParameters();
      if (!p.encodings || !p.encodings.length) p.encodings = [{}];
      if (s.track.kind === 'audio') p.encodings[0].maxBitrate = 28000;
      else { p.encodings[0].maxBitrate = 250000; p.encodings[0].maxFramerate = 15; }
      s.setParameters(p).catch(() => {});
    });
  } catch (_) {}
}

/* مراقبة جودة الشبكة: إيقاف الفيديو تلقائياً عند الضعف للحفاظ على الصوت */
function startMonitor(c) {

    if (c.ended || !c.pc) return;
    try {
      const stats = await c.pc.getStats();
      let lost = 0, recv = 0, rtt = null;
      stats.forEach(r => {
        if (r.type === 'inbound-rtp' && (r.kind === 'audio' || r.mediaType === 'audio')) { lost = r.packetsLost || 0; recv = r.packetsReceived || 0; }

async function startCall(otherUid, otherName, otherPhoto, kind) {

  if (isBlocked(otherUid)) { toast('لقد حظرت هذا المستخدم. ألغِ الحظر أولاً'); return; }
  const stream = await getMedia(kind);
  if (!stream) return;
  nativeCall(true);
  const chatRef = doc(db, 'chats', chatIdFor(me.uid, otherUid));
  const callRef = doc(chatRef, 'messages', 'call_current');
  const id = String(Date.now());
  const c = {
    id, role: 'caller', kind, other: otherUid, name: otherName, photo: otherPhoto,
    chatRef, callRef, localStream: stream, ended: false, seenIce: 0, iceQueue: [], remoteReady: false,
    created: false, pendingIce: [], restarts: 0

  }

    c.hasTurn = ice.turn;
    const pc = makePeer(c, s => updateDoc(callRef, { calleeIce: arrayUnion(s) }).catch(() => {}), ice.servers);
    await pc.setRemoteDescription(d.offer);
    c.remoteReady = true;
    const ans = await pc.createAnswer();
    ans.sdp = tuneSdp(ans.sdp);
    await pc.setLocalDescription(ans);
    await updateDoc(callRef, { answer: { type: ans.type, sdp: ans.sdp }, state: 'accepted' });
    updateDoc(chatRef, { 'call.state': 'accepted' }).catch(() => {});
    ingestIce(c, d.callerIce || []);
    drainIce(c);
    tuneSenders(c);
    armConnTimeout(c);
    c.unsub = onSnapshot(callRef, sn => {
      const dd = sn.data();
      if (!dd || dd.id !== c.id || c.ended) return;
      ingestIce(c, dd.callerIce || []);
      if (dd.restart && dd.restart > c.lastRestart && dd.offer) { c.lastRestart = dd.restart; handleRestart(c, dd); }
      if (dd.state === 'ended' || dd.state === 'missed' || dd.state === 'declined') finish(c, 'ended');
    });
  } catch (e) {
    toast('تعذّر قبول المكالمة: ' + (e.code || e.message || ''), 6000);
    if (c) finish(c, 'ended'); else stream.getTracks().forEach(t => t.stop());
  }
}

/* فحص المكالمات: يحدد سبب عدم عملها */
function gatherIce(servers) {
  return new Promise(res => {
    let stun = false, relay = false, fin = false;
    let pc;
    const done = () => {
      if (fin) return;
      fin = true;
      clearTimeout(t);
      try { if (pc) pc.close(); } catch (_) {}
      res({ stun, relay });
    };
    const t = setTimeout(done, 7000);
    try {
      pc = new RTCPeerConnection({ iceServers: servers });
      pc.createDataChannel('x');
      pc.onicecandidate = ev => {
        if (!ev.candidate) { done(); return; }
        const c = ev.candidate.candidate || '';
        if (c.indexOf(' typ srflx') > -1) stun = true;
        if (c.indexOf(' typ relay') > -1) relay = true;
      };
      pc.createOffer().then(o => pc.setLocalDescription(o)).catch(done);
    } catch (_) { done(); }
  });
}
async function runDiagnostics() {
  const out = h('div', { class: 'diagbox' }, h('p', {}, 'جارٍ الفحص… (حتى 10 ثوانٍ)'));

  const rows = [];
  const add = (label, ok, hint) => rows.push({ label, ok, hint });
  const hasRTC = !!window.RTCPeerConnection;
  add('دعم المكالمات (WebRTC)', hasRTC, 'هذا المتصفح أو التطبيق لا يدعم المكالمات. افتح الموقع في Chrome.');
  const hasMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  add('واجهة الميكروفون والكاميرا', hasMedia, 'التطبيق المحوَّل لا يتيح الميكروفون. ثبّت الموقع من Chrome عبر «إضافة إلى الشاشة الرئيسية».');
  if (hasMedia) {
    try { const s = await navigator.mediaDevices.getUserMedia({ audio: true }); s.getTracks().forEach(t => t.stop()); add('إذن الميكروفون', true, ''); }
    catch (e) { add('إذن الميكروفون', false, 'مرفوض (' + (e && e.name) + '). فعّل الإذن من إعدادات التطبيق في الهاتف، أو افتح الموقع في Chrome.'); }
    try { const s = await navigator.mediaDevices.getUserMedia({ video: true }); s.getTracks().forEach(t => t.stop()); add('إذن الكاميرا', true, ''); }
    catch (e) { add('إذن الكاميرا', false, 'مرفوض (' + (e && e.name) + '). مطلوب للمكالمات المرئية فقط.'); }
    try {
      const outs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audiooutput');
      add('تحويل الصوت إلى السماعة الأذنية', outs.some(d => /earpiece|receiver|handset|سماعة الأذن/i.test(d.label)), 'هذا التطبيق أو المتصفح لا يتيح للمواقع اختيار السماعة الأذنية، فيستخدم الوضع الخاص (صوت منخفض). التحويل الحقيقي يحتاج تطبيقاً أصلياً.');
    } catch (_) {}
  }
  if (hasRTC) {
    const ice = await getIceServers(true);
    const r = await gatherIce(ice.servers);
    add('إعداد خادم TURN', ice.turn, 'لم يُضبط خادم TURN أو بياناته خاطئة. بدونه تفشل المكالمات بين شبكات الجوال المختلفة. سجّل مجاناً في metered.ca ثم أدخل البيانات من الإعدادات ثم إعداد المكالمات.');
    add('الوصول لخادم STUN', r.stun, 'لم تُكتشف شبكتك. المكالمات بين شبكتين مختلفتين قد تفشل.');
    if (ice.turn) add('الاتصال بخادم التمرير TURN', r.relay, 'تعذّر الوصول لخادم التمرير. تحقق من الاسم والمفتاح أو من حصة الحساب المجاني.');
  }
  out.replaceChildren(...rows.map(r => h('div', { class: 'diag' },
    h('span', { class: r.ok ? 'ok' : 'no' }, ico(r.ok ? 'check' : 'x', 20, 2.6)),
    h('div', {}, h('div', {}, r.label), r.ok ? null : h('div', { style: 'color:var(--muted);font-size:13px' }, r.hint)))));
}

let watchUnsub = null, userUnsub = null;
let chatsCache = [], chatsLoaded = false, chatsInit = true, openChatUid = null;
const chatsSubs = new Set();
const seenLast = new Map();
function stopWatch() {
  if (watchUnsub) { watchUnsub(); watchUnsub = null; }
  if (userUnsub) { userUnsub(); userUnsub = null; }
}
function updateTitle() {
  let total = 0;
  chatsCache.forEach(c => { if (!isBlocked(otherOf(c))) total += (c.unread && c.unread[me.uid]) || 0; });
  document.title = total ? '(' + total + ') Nacer chat' : 'Nacer chat';
}
let swReg = null;
async function sysNotify(title, body, hash, tag) {
  try {
    if (window.NativeBridge && window.NativeBridge.notifyMsg) { window.NativeBridge.notifyMsg(title, body, hash); return true; }
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return false;
    const opts = { body, icon: APP_ICON, badge: APP_ICON, tag, lang: 'ar', dir: 'rtl', data: { hash } };
    if (swReg && swReg.showNotification) { await swReg.showNotification(title, opts); return true; }
    const n = new Notification(title, opts);
    n.onclick = () => { try { window.focus(); } catch (_) {} location.hash = hash; n.close(); };
    return true;
  } catch (_) { return false; }
}
async function notifyMessage(c, other) {
  const name = (c.names && c.names[other]) || '';
  const photo = (c.photos && c.photos[other]) || '';
  const text = await previewAsync(c);
  const hash = 'chat/' + other + '/' + encodeURIComponent(name);
  soundRecv();
  if (document.hidden) await sysNotify(name, text, hash, 'c_' + c.id);
  else showBanner(name, text, photo, () => { location.hash = hash; });
}
function handleCall(c) {
  const cl = c.call;
  if (!cl) return;
  if (incomingUI && incomingUI.info.id === cl.id && cl.state !== 'ringing') { dismissIncoming(); return; }
  const age = cl.at ? Date.now() - ms(cl.at) : 1e9;
  const fresh = age < 90000 && age > -120000;
  if (cl.state === 'ringing' && cl.from !== me.uid && fresh && !activeCall && !incomingUI && cl.id !== lastIncomingId && !isBlocked(cl.from)) {
    lastIncomingId = cl.id;
    showIncoming({
      chatId: c.id, id: cl.id, other: cl.from, kind: cl.kind,
      name: (c.names && c.names[cl.from]) || '',
      photo: (c.photos && c.photos[cl.from]) || ''
    });
  }
}
function handleMsg(c, snap) {
  const lt = ms(c.lastTime);
  const prev = seenLast.get(c.id);
  seenLast.set(c.id, lt);
  if (chatsInit || !c.lastSender || c.lastSender === me.uid) return;
  if (lt <= (prev || 0) || snap.metadata.fromCache) return;
  const other = otherOf(c);
  if (isBlocked(other) || !notifOn()) return;
  if (openChatUid === other && !document.hidden) return;
  notifyMessage(c, other);
}
function watchGlobal() {
  stopWatch();
  chatsLoaded = false; chatsInit = true; seenLast.clear(); chatsCache = [];
  const q = query(collection(db, 'chats'), where('participants', 'array-contains', me.uid));
  watchUnsub = onSnapshot(q, snap => {
    chatsCache = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }));
    chatsLoaded = true;
    chatsCache.forEach(c => { handleCall(c); handleMsg(c, snap); });
    chatsInit = false;
    updateTitle();
    chatsSubs.forEach(f => f());
  }, () => {});
  userUnsub = onSnapshot(doc(db, 'users', me.uid), s => {
    const d = s.exists() ? s.data() : {};
    blockedSet = new Set(d.blocked || []);
    if (s.exists() && !d.deleted) profile = { name: d.name || profile.name, photo: d.photo || '' };
    saveAccount();
    updateTitle();
    chatsSubs.forEach(f => f());
  }, () => {});
}

/* التقاط صورة من الكاميرا (للملف الشخصي وغيره) مع زر قلب الكاميرا */
function captureCamera(facing = 'user') {
  return new Promise(async (resolve) => {
    const open = (f) => navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: f } }, audio: false });
    let stream;
    try { stream = await open(facing); }
    catch (e) { toast('تعذّر فتح الكاميرا: ' + (e.message || e.name || '')); resolve(null); return; }
    const video = document.createElement('video');
    video.autoplay = true; video.muted = true; video.setAttribute('playsinline', '');
    video.srcObject = stream;
    video.style.cssText = 'width:100%;height:100%;object-fit:contain';
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;z-index:300;background:#000;display:flex;flex-direction:column';
    const wrap = document.createElement('div');
    wrap.style.cssText = 'flex:1;min-height:0';
    wrap.append(video);
    const bar = document.createElement('div');
    bar.style.cssText = 'display:flex;justify-content:space-around;align-items:center;padding:16px;background:#000';
    const stop = (res) => { stream.getTracks().forEach(t => t.stop()); box.remove(); resolve(res || null); };
    const btn = (txt, fn) => { const b = document.createElement('button'); b.textContent = txt; b.style.cssText = 'font-size:30px;border:0;background:none;color:#fff;padding:8px 20px'; b.onclick = fn; return b; };
    let cur = facing;
    const flip = async () => {
      const prev = cur, next = prev === 'user' ? 'environment' : 'user';
      stream.getTracks().forEach(t => t.stop());
      try { stream = await open(next); cur = next; }
      catch (_) { try { stream = await open(prev); } catch (e) { toast('تعذّر تبديل الكاميرا'); } }
      video.srcObject = stream;
    };
    bar.append(
      btn('✕', () => stop(null)),
      btn('🔄', flip),
      btn('📸', () => {
        if (!video.videoWidth) return;
        const c = document.createElement('canvas');
        c.width = video.videoWidth; c.height = video.videoHeight;
        c.getContext('2d').drawImage(video, 0, 0);
        c.toBlob(b => stop(b ? new File([b], 'camera.jpg', { type: 'image/jpeg' }) : null), 'image/jpeg', 0.9);
      }));
    box.append(wrap, bar);
    document.body.append(box);
  });
}

  async function sendBig(f) {

    for (let i = 0; i < total; i++) {
      toast('جارٍ رفع «' + f.name + '» ' + Math.round(i / total * 100) + '%', 0);
      const part = f.slice(i * CHUNK, (i + 1) * CHUNK);
      const data = key ? await aesEncBytes(key, new Uint8Array(await part.arrayBuffer())) : await blobToB64(part);
      await setDoc(doc(chatRef, 'messages', id + '_' + i), { senderId: me.uid, chunk: i, data });
    }
    hideToast();
    const type = f.type || 'application/octet-stream';
    const sealed = await sealMessage(otherUid, { text: '', file: { name: f.name, type, size: f.size, chunks: total, enc: !!key } },
      (type.startsWith('video/') ? 'فيديو: ' : 'ملف: ') + f.name);

    } catch (e) { toast('تعذّر فتح الكاميرا: ' + (e.message || e.name || '')); return; }
    const video = document.createElement('video');
    video.autoplay = true; video.muted = true; video.setAttribute('playsinline', '');
    video.srcObject = stream;

    const btn = (txt, fn) => { const b = document.createElement('button'); b.textContent = txt; b.style.cssText = 'font-size:30px;border:0;background:none;color:#fff;padding:8px 20px'; b.onclick = fn; return b; };

      const prev = facing, next = prev === 'environment' ? 'user' : 'environment';

      try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: next } }, audio: false }); facing = next; }

      btn('📸', () => {
        if (!video.videoWidth) return;
        const c = document.createElement('canvas');

      })

    sendBtn);
  function applyBlocked() {
    blockBar.style.display = blockedNow ? 'flex' : 'none';
    composer.style.display = blockedNow ? 'none' : 'flex';
  }
  const onB = () => { const nb = isBlocked(otherUid); if (nb !== blockedNow) { blockedNow = nb; applyBlocked(); render(); } };
  chatsSubs.add(onB);
  cleanup.push(() => chatsSubs.delete(onB));
  applyBlocked();

  return h('div', { class: 'screen' },
    h('header', { class: 'top' },
      iconBtn('back', 'رجوع', () => history.back()),
      hdrWrap,
      h('div', { class: 'htwrap' }, title, sub),
      iconBtn('phone', 'اتصال صوتي', () => startCall(otherUid, title.textContent, curPhoto, 'audio'), 'ib acc'),
      iconBtn('video', 'اتصال مرئي', () => startCall(otherUid, title.textContent, curPhoto, 'video'), 'ib acc'),
      iconBtn('more', 'المزيد', chatMenu)),
    box, blockBar, composer);
}

/* ---------- التوجيه ---------- */
function route() {
  clear();
  if (me === undefined) return;
  if (!me) { show(authView()); return; }
  const [p, a, b] = location.hash.slice(1).split('/');
  if (p === 'search' || p === 'members') show(searchView());
  else if (p === 'settings') show(settingsView());
  else if (p === 'profile') show(profileView());
  else if (p === 'blocked') show(blockedView());
  else if (p === 'chat' && a) show(chatView(a, decodeURIComponent(b || '')));
  else show(homeView());
}
function withTimeout(p, t) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), t))]); }
async function unregisterPush() {
  try {
    if (!window.NativeBridge || !window.NativeBridge.getFcmToken || !me) return;
    const t = window.NativeBridge.getFcmToken();
    if (t) await withTimeout(setDoc(doc(db, 'fcmTokens', me.uid), { tokens: arrayRemove(t) }, { merge: true }), 4000);
  } catch (_) {}
}
async function signOutClean() { await unregisterPush(); try { await withTimeout(setDoc(doc(db, 'users', me.uid), { on: false, seen: serverTimestamp() }, { merge: true }), 3000); } catch (_) {} return signOut(auth); }
function registerPush() {
  if (!window.NativeBridge || !window.NativeBridge.getFcmToken) return;
  const save = t => { if (t && me) setDoc(doc(db, 'fcmTokens', me.uid), { tokens: arrayUnion(t) }, { merge: true }).catch(() => {}); };
  window.__onFcmToken = save;
  try { save(window.NativeBridge.getFcmToken()); } catch (_) {}
  try { if (window.NativeBridge.setMsgNotifications) window.NativeBridge.setMsgNotifications(notifOn()); } catch (_) {}
}
function startSession() { if (me) { startPresence(); watchGlobal(); registerPush(); getIceServers().catch(() => {}); } }
app.replaceChildren(h('div', { class: 'splash' }, logoSVG(96)));
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(() => {});
  navigator.serviceWorker.addEventListener('message', ev => { if (ev.data && typeof ev.data.hash === 'string') location.hash = ev.data.hash; });
}
onAuthStateChanged(auth, async u => {
  me = u;
  if (!u || u.uid !== presUid) { resetPresence(); presUid = u ? u.uid : null; }
  if (u) {
    const pw = authState.pw;
    authState.pw = '';
    let d = null, fetched = false;
    try {
      const sn = await withTimeout(getDoc(doc(db, 'users', u.uid)), 8000);
      d = sn.exists() ? sn.data() : {};
      if (d.kb) {
        // حساب قديم: ما زالت نسخة المفتاح في الملف العام من قبل هذا التحديث.
        // انسخها أولاً إلى المكان الآمن الجديد، ولا تُحذف من مكانها القديم إلا بعد التأكد من نجاح النسخ،
        // حتى لا تضيع النسخة الوحيدة من المفتاح إن فشل الاتصال في منتصف العملية.
        try {
          await setDoc(doc(db, 'users', u.uid, 'private', 'data'), { kb: d.kb }, { merge: true });
          await updateDoc(doc(db, 'users', u.uid), { kb: deleteField() });
        } catch (_) { /* فشل الترحيل: اترك kb في مكانه القديم لمحاولة لاحقة، فهذا أفضل من فقدانه */ }
      } else {
        try { const ps = await withTimeout(getDoc(doc(db, 'users', u.uid, 'private', 'data')), 8000); if (ps.exists() && ps.data().kb) d.kb = ps.data().kb; } catch (_) {}
      }
      fetched = true;
    } catch (_) {}
    profile = { name: (d && d.name) || u.displayName || profile.name || '', photo: (d && d.photo) || '' };
    blockedSet = new Set((d && d.blocked) || []);
    if (d && (d.email || d.emailLower)) {
      updateDoc(doc(db, 'users', u.uid), { email: deleteField(), emailLower: deleteField() }).catch(() => {});
    }
    await setupKeys(u, fetched ? d : null, pw);
    saveAccount();
    startSession();
  } else {
    stopWatch();
    dismissIncoming();
    if (activeCall) finish(activeCall, 'ended');
    myKeys = null;
    profile = { name: '', photo: '' };
    blockedSet = new Set();
    chatsCache = [];
    document.title = 'Nacer chat';
    location.hash = '';
  }
  route();
});
addEventListener('hashchange', route);
/* تنبيه عند العودة للتطبيق إن وصلت رسائل أثناء غيابك */
let unreadAtHide = null;
const totalUnread = () => chatsCache.reduce((n, c) => n + (isBlocked(otherOf(c)) ? 0 : ((c.unread && c.unread[me.uid]) || 0)), 0);
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (!me) return;
  if (document.hidden) { hiddenAt = Date.now(); unreadAtHide = totalUnread(); return; }
  /* بعد غياب طويل قد تكون قناة Firestore ميتة في الخلفية فلا تصل الرسائل الجديدة؛ نعيد الاتصال */
  if (hiddenAt && Date.now() - hiddenAt > 20000) {
    hiddenAt = 0;
    try { disableNetwork(db).then(() => enableNetwork(db)).catch(() => {}); } catch (_) {}
  }
  if (unreadAtHide === null) return;
  const before = unreadAtHide;
  unreadAtHide = null;
  setTimeout(() => {
    const diff = totalUnread() - before;
    if (diff > 0 && notifOn()) { soundRecv(); showBanner('رسائل جديدة', 'وصلتك ' + diff + ' رسالة أثناء غيابك', '', () => { location.hash = ''; }); }
  }, 1800);
});
/* فك قفل الصوت عند أول لمسة حتى تعمل الأصوات دائماً */
['pointerdown', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, () => ac(), { passive: true }));
